<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind CSS Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'neutral': {
                            900: '#1A1A1A', // Deep matte black
                            800: '#2A2A2A', // Slightly lighter black
                            700: '#3A3A3A',
                            600: '#4A4A4A',
                            500: '#666666',
                        },
                        'sky': {
                            50: '#F0F8FF',
                            100: '#E0F2F7',
                            200: '#B3E5FC',
                            300: '#81D4FA',
                            400: '#4FC3F7',
                            500: '#00B0FF', // Light Sky Blue (main accent)
                            600: '#0091EA',
                            700: '#0079C2',
                            800: '#005B9C',
                            900: '#003F6B',
                        },
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-down': 'slideDown 0.6s ease-out forwards',
                    },
                    dropShadow: {
                        sky: '0 0 10px rgba(0, 176, 255, 0.7)', // Custom glow for icons
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="root"></div>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Main React App Script - Now type="text/babel" -->
    <script type="text/babel">
        // React App Component
        const App = () => {
            // Hardcoded portfolio data
            const portfolioData = {
                name: 'Pranav Gandha',
                tagline: 'Full-Stack Developer, AI Developer, UI/UX Enthusiast',
                intro: 'Passionate about crafting intuitive and performant web experiences along with developing AI components, I thrive on bringing ideas to life through clean code and thoughtful design. My journey in development is fueled by curiosity and a commitment to continuous learning.',
                skills: ['React', 'Node.js', 'Python', 'JavaScript', 'HTML', 'CSS', 'Tailwind CSS', 'Figma','Framer'],
                social: {
                    github: 'https://github.com/PranavLabs',
                    linkedin: 'https://linkedin.com/in/your-username',
                    x: 'https://x.com/pranavbyte',
                    insta: 'https://instagram.com/your-username',
                },
            };

            return (
                <div className="min-h-screen bg-neutral-900 text-gray-100 font-inter flex flex-col items-center justify-center p-4">
                    <Portfolio data={portfolioData} />
                </div>
            );
        };

        // Portfolio Component
        const Portfolio = ({ data }) => {
            return (
                <div className="w-full max-w-4xl bg-neutral-800 rounded-xl shadow-2xl p-8 md:p-12 space-y-12 animate-fade-in">
                    {/* Hero Section */}
                    <header className="text-center space-y-4">
                        <h1 className="text-5xl md:text-6xl font-extrabold text-gray-50 leading-tight tracking-tight animate-slide-down">
                            {data.name}
                        </h1>
                        <h2 className="text-2xl md:text-3xl font-semibold text-sky-400 animate-slide-down delay-100">
                            {data.tagline}
                        </h2>
                        <p className="text-lg md:text-xl text-gray-300 max-w-2xl mx-auto animate-slide-down delay-200">
                            {data.intro}
                        </p>
                    </header>

                    {/* Skills Section */}
                    <section className="text-center">
                        <h3 className="text-3xl md:text-4xl font-bold text-gray-50 mb-8 relative inline-block group">
                            My Skills
                            <span className="absolute left-1/2 -translate-x-1/2 bottom-0 w-12 h-1 bg-sky-500 rounded-full transition-all duration-300 ease-in-out group-hover:w-24"></span>
                        </h3>
                        <div className="flex flex-wrap justify-center gap-4">
                            {data.skills.map((skill, index) => (
                                <div
                                    key={index}
                                    className="px-6 py-3 bg-neutral-700 text-gray-100 rounded-full text-lg font-medium shadow-md
                                               hover:bg-sky-500 hover:text-neutral-900 transform hover:-translate-y-1 transition-all duration-300 ease-in-out
                                               hover:shadow-sky-500/50 cursor-default"
                                >
                                    {skill}
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Social Links Section */}
                    <section className="text-center">
                        <h3 className="text-3xl md:text-4xl font-bold text-gray-50 mb-8 relative inline-block group">
                            Connect With Me
                            <span className="absolute left-1/2 -translate-x-1/2 bottom-0 w-12 h-1 bg-sky-500 rounded-full transition-all duration-300 ease-in-out group-hover:w-24"></span>
                        </h3>
                        <div className="flex justify-center gap-8">
                            {/* Using Font Awesome icons */}
                            <SocialLink href={data.social.github} iconClass="fab fa-github" label="GitHub" />
                            <SocialLink href={data.social.linkedin} iconClass="fab fa-linkedin" label="LinkedIn" />
                            <SocialLink href={data.social.x} iconClass="fab fa-twitter" label="X (Twitter)" /> {/* Font Awesome uses fa-twitter for X */}
                            <SocialLink href={data.social.insta} iconClass="fab fa-instagram" label="Instagram" />
                        </div>
                    </section>
                </div>
            );
        };

        // SocialLink Component - Updated to use iconClass for Font Awesome
        const SocialLink = ({ href, iconClass, label }) => (
            <a
                href={href}
                target="_blank"
                rel="noopener noreferrer"
                className="text-gray-300 hover:text-sky-500 transform hover:scale-125 transition-all duration-300 ease-in-out group"
                aria-label={label}
            >
                <i className={`${iconClass} text-5xl drop-shadow-lg group-hover:drop-shadow-sky`}></i>
                <span className="sr-only">{label}</span>
            </a>
        );

        // Render the React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
