<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranav Gandha - Full-Stack Developer & AI Enthusiast</title>

    <meta name="description" content="Pranav Gandha - Full-Stack Developer, AI Developer, and UI/UX Enthusiast.">
    <meta name="author" content="Pranav Gandha">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#050505',
                        surface: '#111111',
                        surfaceHover: '#1a1a1a',
                        border: '#222222',
                        textMain: '#EDEDED',
                        textMuted: '#A1A1AA',
                        accent: '#38BDF8',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'glow-pulse': 'glowPulse 4s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        glowPulse: {
                            '0%': { opacity: '0.3', transform: 'scale(1)' },
                            '100%': { opacity: '0.6', transform: 'scale(1.2)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: #EDEDED; overflow-x: hidden; }
        .glass-card {
            background: rgba(17, 17, 17, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(26, 26, 26, 0.6);
        }
        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body class="font-inter antialiased selection:bg-accent selection:text-black">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const App = () => {
            const portfolioData = {
                name: 'Pranav Gandha',
                tagline: 'Full-Stack Developer & AI Innovator',
                intro: 'As a B.Tech Computer Science student and freelance AI Generalist, I am passionate about crafting intuitive web experiences and developing intelligent AI models. I thrive on bringing ambitious ideas to life through scalable backend architecture, clean frontend design, and advanced data-driven solutions.',
                skills: [
                    'AI/ML', 'PyTorch (Beginner)', 'Leadership', 'Communication (IELTS 7.5)', 
                    'C/C++', 'Frontend', 'Backend', 'AWS', 'NoSQL', 'PostgreSQL', 'DevOps'
                ],
                achievements: [
                    { 
                        title: 'RCS CTF 2026', 
                        value: 'Winner', 
                        desc: 'National-Level Hackathon',
                        icon: 'fa-solid fa-flag-checkered'
                    },
                    { 
                        title: 'WorldQuant BRAIN', 
                        value: 'Gold Level', 
                        desc: '& Consultant',
                        icon: 'fa-solid fa-brain'
                    },
                    { 
                        title: 'Academic Record', 
                        value: '8.5 CGPA', 
                        desc: 'Overall Score',
                        icon: 'fa-solid fa-graduation-cap'
                    }
                ],
                projects: [
                    {
                        title: 'Eco-Gram (Ecocheck)',
                        description: 'An AI-powered tool designed to quantify the environmental impact of urban spaces using computer vision. By analyzing images for biodiversity, transportation modes, and electronic waste, it generates a "Sustainability Score" to evaluate the ecological health of a captured scene.',
                        tech: ['AI/ML', 'Computer Vision', 'Streamlit', 'Python'],
                        github: '#',
                        demo: 'https://ecocheck.streamlit.app',
                        icon: 'fa-solid fa-leaf'
                    },
                    {
                        title: 'Natya-AI',
                        description: 'An intelligent application that recommends personalized entertainment content dynamically based on user preferences and conversational chat inputs.',
                        tech: ['AI/ML', 'Frontend', 'Backend', 'NLP'],
                        github: '#',
                        demo: 'https://natyamv.onrender.app',
                        icon: 'fa-solid fa-film'
                    }
                ],
                social: {
                    github: 'https://github.com/PranavLabs',
                    linkedin: 'https://www.linkedin.com/in/pranav-gandha-a5a27a291/',
                    x: 'https://x.com/pranavbyte',
                    insta: 'https://instagram.com/pranav.x.d',
                    email: 'mailto:pranavgandha@hotmail.com'
                },
            };

            return (
                <div className="relative min-h-screen pb-24">
                    {/* Ambient Background Glows */}
                    <div className="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-accent/10 blur-[120px] rounded-full pointer-events-none animate-glow-pulse z-0"></div>
                    
                    <div className="relative z-10 max-w-5xl mx-auto px-6 pt-24 md:pt-32">
                        {/* Hero Section */}
                        <header className="mb-20 animate-fade-in-up">
                            <div className="inline-block mb-4 px-3 py-1 text-xs font-mono text-accent border border-accent/20 bg-accent/10 rounded-full">
                                Available for opportunities
                            </div>
                            <h1 className="text-5xl md:text-7xl font-bold tracking-tight mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white via-white to-gray-500">
                                {portfolioData.name}
                            </h1>
                            <h2 className="text-2xl md:text-3xl font-medium text-textMuted mb-6">
                                {portfolioData.tagline}
                            </h2>
                            <p className="text-lg text-textMuted leading-relaxed max-w-2xl">
                                {portfolioData.intro}
                            </p>
                        </header>

                        {/* Bento Grid: Achievements */}
                        <section className="mb-24 opacity-0 animate-fade-in-up" style={{animationDelay: '0.2s'}}>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                {portfolioData.achievements.map((ach, idx) => (
                                    <div key={idx} className="glass-card p-6 rounded-2xl transition-all duration-300 group">
                                        <div className="flex justify-between items-start mb-4">
                                            <i className={`${ach.icon} text-2xl text-textMuted group-hover:text-accent transition-colors`}></i>
                                        </div>
                                        <h3 className="text-3xl font-bold text-white mb-1">{ach.value}</h3>
                                        <p className="font-medium text-textMain">{ach.title}</p>
                                        <p className="text-sm text-textMuted mt-1">{ach.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Skills Section */}
                        <section className="mb-24 opacity-0 animate-fade-in-up" style={{animationDelay: '0.3s'}}>
                            <h3 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                <i className="fa-solid fa-layer-group text-accent"></i> Technical Arsenal
                            </h3>
                            <div className="flex flex-wrap gap-3">
                                {portfolioData.skills.map((skill, index) => (
                                    <span key={index} className="px-4 py-2 text-sm font-medium text-textMain glass-card rounded-full hover:-translate-y-1 transition-transform cursor-default">
                                        {skill}
                                    </span>
                                ))}
                            </div>
                        </section>

                        {/* Projects Section */}
                        <section className="mb-24 opacity-0 animate-fade-in-up" style={{animationDelay: '0.4s'}}>
                            <h3 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                <i className="fa-solid fa-code text-accent"></i> Featured Work
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {portfolioData.projects.map((project, index) => (
                                    <div key={index} className="glass-card p-8 rounded-3xl flex flex-col h-full transition-all duration-300">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="w-12 h-12 rounded-full bg-surface border border-border flex items-center justify-center">
                                                <i className={`${project.icon} text-accent text-xl`}></i>
                                            </div>
                                            <h4 className="text-2xl font-bold text-white">{project.title}</h4>
                                        </div>
                                        <p className="text-textMuted mb-8 flex-grow leading-relaxed">
                                            {project.description}
                                        </p>
                                        <div className="flex flex-wrap gap-2 mb-8">
                                            {project.tech.map((t, i) => (
                                                <span key={i} className="text-xs font-mono px-2 py-1 bg-surface border border-border rounded text-textMuted">
                                                    {t}
                                                </span>
                                            ))}
                                        </div>
                                        <div className="flex gap-4 mt-auto">
                                            <a href={project.demo} target="_blank" rel="noopener noreferrer" 
                                               className="flex-1 text-center py-3 bg-white text-black font-semibold rounded-xl hover:bg-gray-200 transition-colors">
                                                Live Demo <i className="fa-solid fa-arrow-up-right-from-square ml-1 text-sm"></i>
                                            </a>
                                            <a href={project.github} target="_blank" rel="noopener noreferrer"
                                               className="px-6 py-3 bg-surface border border-border text-white rounded-xl hover:bg-surfaceHover transition-colors flex items-center justify-center">
                                                <i className="fa-brands fa-github text-lg"></i>
                                            </a>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Footer / Socials */}
                        <footer className="pt-12 border-t border-border/50 flex flex-col md:flex-row justify-between items-center gap-6 opacity-0 animate-fade-in-up" style={{animationDelay: '0.5s'}}>
                            <div className="text-textMuted text-sm">
                                © {new Date().getFullYear()} Pranav Gandha. Building the future.
                            </div>
                            <div className="flex gap-4">
                                <SocialLink href={portfolioData.social.x} icon="fa-brands fa-x-twitter" />
                                <SocialLink href={portfolioData.social.github} icon="fa-brands fa-github" />
                                <SocialLink href={portfolioData.social.linkedin} icon="fa-brands fa-linkedin-in" />
                                <SocialLink href={portfolioData.social.insta} icon="fa-brands fa-instagram" />
                                <SocialLink href={portfolioData.social.email} icon="fa-regular fa-envelope" />
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        const SocialLink = ({ href, icon }) => (
            <a href={href} target="_blank" rel="noopener noreferrer" 
               className="w-10 h-10 flex items-center justify-center rounded-full glass-card text-textMuted hover:text-white hover:scale-110 transition-all duration-300">
                <i className={icon}></i>
            </a>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
