                                        </h3>
                                        <p className="text-sm sm:text-base text-slateMuted leading-relaxed max-w-xl">
                                            I'm open for high-impact AI/ML engineering roles, full-stack architecture opportunities, and ambitious software collaborations.
                                        </p>

                                        <div className="pt-2 flex flex-wrap gap-4">
                                            <a 
                                                href={`mailto:${portfolioData.contact.email}`}

                                            >
                                                <i className="fa-regular fa-envelope text-base text-black"></i>
                                                <span>Send Email</span>
                                            </a>
                                            <a 
                                                href={portfolioData.cvDownloadLink}
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="btn-liquid-secondary px-6 py-3.5 rounded-2xl font-display text-sm text-white flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-file-arrow-down text-cyanNeon"></i>
                                                <span>Download CV</span>
                                            </a>
                                        </div>
                                    </div>

                                    {/* Direct Interactive Cards */}
                                    <div className="lg:col-span-5 space-y-3.5">
                                        <div 
                                            onClick={() => copyToClipboard(portfolioData.contact.email, 'email_card')}
                                            className="p-4 rounded-2xl liquid-glass hover:border-cyanNeon/50 cursor-pointer transition-all flex items-center justify-between"
                                        >
                                            <div className="flex items-center gap-3.5">
                                                <div className="w-10 h-10 rounded-xl liquid-glass flex items-center justify-center text-cyanNeon">
                                                    <i className="fa-regular fa-envelope"></i>
                                                </div>
                                                <div>
                                                    <div className="text-[10px] font-mono text-slateMuted">Email Address</div>
                                                    <div className="text-sm font-medium text-white">{portfolioData.contact.email}</div>
                                                </div>
                                            </div>
                                            <i className={`fa-solid ${copiedKey === 'email_card' ? 'fa-check text-mintNeon' : 'fa-copy text-slateMuted'} text-sm`}></i>
                                        </div>

                                        <div 
                                            onClick={() => copyToClipboard(portfolioData.contact.phone, 'phone_card')}

                                                </div>
                                                <div>
                                                    <div className="text-[10px] font-mono text-slateMuted">Phone / WhatsApp</div>
                                                    <div className="text-sm font-medium text-white">{portfolioData.contact.phone}</div>
                                                </div>
                                            </div>
                                            <i className={`fa-solid ${copiedKey === 'phone_card' ? 'fa-check text-mintNeon' : 'fa-copy text-slateMuted'} text-sm`}></i>
                                        </div>

                                        <a 
                                            href={portfolioData.contact.linkedin}
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="p-4 rounded-2xl liquid-glass hover:border-cyanNeon/50 transition-all flex items-center justify-between group"
                                        >
                                            <div className="flex items-center gap-3.5">
                                                <div className="w-10 h-10 rounded-xl liquid-glass flex items-center justify-center text-cyanNeon">
                                                    <i className="fa-brands fa-linkedin-in"></i>
                                                </div>
                                                <div>
                                                    <div className="text-[10px] font-mono text-slateMuted">LinkedIn Network</div>
                                                    <div className="text-sm font-medium text-white">in/pranavgandha</div>
                                                </div>
                                            </div>
                                            <i className="fa-solid fa-arrow-up-right-from-square text-xs text-slateMuted group-hover:text-cyanNeon group-hover:translate-x-0.5 transition-all"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* FOOTER */}
                        <footer className="pt-10 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-6 text-xs font-mono text-slateMuted">
                            <div>
                                © {new Date().getFullYear()} Pranav Gandha. Designed with Liquid Glass UI.
                            </div>

                            <div className="flex items-center gap-3">
                                <LiquidSocial href={portfolioData.contact.github} icon="fa-brands fa-github" title="GitHub" />
                                <LiquidSocial href={portfolioData.contact.linkedin} icon="fa-brands fa-linkedin-in" title="LinkedIn" />
                                <LiquidSocial href={portfolioData.contact.x} icon="fa-brands fa-x-twitter" title="X (Twitter)" />
                                <LiquidSocial href={portfolioData.contact.insta} icon="fa-brands fa-instagram" title="Instagram" />
                                <LiquidSocial href={`mailto:${portfolioData.contact.email}`} icon="fa-regular fa-envelope" title="Email" />
                            </div>
                        </footer>

                    </main>
                </div>
            );
        };

        const LiquidSocial = ({ href, icon, title }) => (
            <a 
                href={href} 
                target="_blank" 
                rel="noopener noreferrer" 
                title={title}
                className="w-10 h-10 flex items-center justify-center rounded-xl liquid-glass text-slateMuted hover:text-white hover:border-cyanNeon/50 hover:scale-110 transition-all duration-300"
            >
                <i className={icon}></i>
            </a>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
